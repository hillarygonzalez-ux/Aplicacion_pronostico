<!DOCTYPE html>
<html>
<head>
    <title>Aplicación de Pronósticos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Aplicación de Pronósticos</h1>

    <form method="POST" enctype="multipart/form-data">
        <label>Subir archivo CSV</label>
        <input type="file" name="file" required>

        <label>Valor de N</label>
        <input type="number" name="n" min="1" required>

        <button type="submit">Calcular Pronóstico</button>
    </form>

    {% if resultados %}
    <h2>Resultados</h2>
    <div class="resultados-grid">
        {% for prod, info in resultados.items() %}
            <div class="resultado">
                <h3>{{ prod }}</h3>
                <p><strong>Pronóstico:</strong> {{ info.pronostico }}</p>
                <p><strong>MAE:</strong> {{ info.mae }}, <strong>MSE:</strong> {{ info.mse }}, <strong>MAPE:</strong> {{ info.mape }}%</p>
                <img src="{{ url_for('static', filename=prod + '.png') }}" alt="Gráfico {{ prod }}">
            </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
</body>
</html>
